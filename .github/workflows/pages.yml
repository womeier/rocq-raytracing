name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://womeier.cachix.org https://coq-community.cachix.org https://coq.cachix.org
            extra-trusted-public-keys = womeier.cachix.org-1:0R8+V2ZDOk7mKAA+hF2VulnUoM3Qh8jmeDkcV8gw2Rs= coq-community.cachix.org-1:WBDHojv8FM6nI4ZMh43X+2g6j4WpAn+dFhjhWmLCgnA= coq.cachix.org-1:5QW/wwEnD+l2jvN6QRbRRsa4hBHG3QiQQ26cxu1F5tI=

      # CertiRocq (and CompCert, which comes with it) must come from a
      # binary cache: building them here would not fit in a CI run.
      # --max-jobs 0 forbids local building, so a cache miss fails fast
      # instead of after an hour of compiling.
      - name: Fetch the prebuilt CertiRocq toolchain
        run: nix build -L --max-jobs 0 --no-link .#CertiRocq

      - name: Build the web bundle
        run: nix build -L

      - name: Copy the bundle out of the nix store
        run: |
          mkdir site
          cp -L result/* site/
          chmod -R u+w site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
